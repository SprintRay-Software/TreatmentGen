[project]
name = "report-generation"
version = "0.1.0"
description = "From the structured output of the visual expert model to medical reports."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.1",
    "fastapi[standard]>=0.121.0",
    "langfuse>=3.9.1",
    "loguru>=0.7.3",
    "modal==1.2.1",
    "requests>=2.32.5",
    "tenacity>=9.1.2",
    "torch>=2.8.0",
    "vllm==0.11.0",
    "torch==2.8.0",
    "httpx[socks]>=0.28.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
]
lint = [
    "ruff>=0.11.7"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100
lint.select = ["E", "W", "F", "I", "B", "C4", "ARG001"]
lint.ignore = ["E501", "B008", "W191", "B904"]

[tool.uv.sources]
torch = {index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'"}

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
