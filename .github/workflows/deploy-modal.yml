name: Modal CI/CD (TreatmentGen)

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Environment to promote (dev / stg / prod)"
        required: true
        type: choice
        default: dev
        options: [dev, stg, prod]

env:
  APP_NAME: TreatmentGen

jobs:
  deploy_dev:
    if: ${{ github.ref_name == 'dev' || (github.event_name == 'workflow_dispatch' && inputs.stage == 'dev') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.setver.outputs.version }}

    env:
      MODAL_TOKEN_ID:     ${{ secrets.MODAL_SPRINTRAY_AI_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_SPRINTRAY_AI_TOKEN_SECRET }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }

      - name: 📦 Install Modal CLI & jq
        run: |
          python -m pip install --upgrade pip
          pip install modal jq

      - name: 🔖 Compute today’s version (yy.mm.dd.n)
        id: setver
        run: |
          TODAY=$(date -u +'%y.%m.%d')
          COUNT=$(
            modal app history "$APP_NAME" -e dev --json 2>/dev/null \
            | jq -r --arg D "$TODAY" \
                '[.[].tag // empty | select(startswith($D))] | length'
          )
          VERSION="$TODAY.$((COUNT+1))"
          echo "version=$VERSION" >>"$GITHUB_OUTPUT"
          echo "::notice ::Deploying version $VERSION to dev"

      - name: 🚀 Deploy to dev
        run: |
          modal deploy deploy.py \
            --name "$APP_NAME" \
            -e dev \
            --tag "${{ steps.setver.outputs.version }}"

  promote_stg:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.stage == 'stg' }}
    runs-on: ubuntu-latest

    env:
      MODAL_TOKEN_ID:     ${{ secrets.MODAL_SPRINTRAY_AI_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_SPRINTRAY_AI_TOKEN_SECRET }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - name: 📦 Install Modal CLI & jq
        run: pip install modal jq

      - name: 🔐 Authenticate with Modal
        run: |
          modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET" --profile=sprintray-ai

      - name: 🔄 Promote latest dev build → stg
        run: |
          VERSION=$(modal app history "$APP_NAME" -e dev --json \
                     | jq -r '.[0].Tag')
          echo "::notice ::Promoting $VERSION to staging"
          
          # Get the commit hash for this version from dev
          COMMIT=$(modal app history "$APP_NAME" -e dev --json \
                   | jq -r '.[0].Commit // empty' | sed 's/\*$//')
          
          # Deploy to staging with the same tag and commit
          if [ -n "$COMMIT" ] && [ "$COMMIT" != "null" ]; then
            echo "::notice ::Deploying from commit $COMMIT with tag $VERSION"
            git checkout "$COMMIT" 2>/dev/null || echo "::warning ::Could not checkout commit, using current code"
          fi
          
          modal deploy deploy.py \
            --name "$APP_NAME" \
            -e stg \
            --tag "$VERSION"

  promote_prod:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.stage == 'prod' }}
    runs-on: ubuntu-latest

    env:
      MODAL_TOKEN_ID:     ${{ secrets.MODAL_SPRINTRAY_AI_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_SPRINTRAY_AI_TOKEN_SECRET }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - name: 📦 Install Modal CLI & jq
        run: pip install modal jq

      - name: 🔐 Authenticate with Modal
        run: |
          modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET" --profile=sprintray-ai

      - name: 🔄 Promote latest stg build → prod
        run: |
          VERSION=$(modal app history "$APP_NAME" -e stg --json \
                     | jq -r '.[0].Tag')
          echo "::notice ::Promoting $VERSION to production"
          
          # Get the commit hash for this version from stg
          COMMIT=$(modal app history "$APP_NAME" -e stg --json \
                   | jq -r '.[0].Commit // empty' | sed 's/\*$//')
          
          # Deploy to production with the same tag and commit
          if [ -n "$COMMIT" ] && [ "$COMMIT" != "null" ]; then
            echo "::notice ::Deploying from commit $COMMIT with tag $VERSION"
            git checkout "$COMMIT" 2>/dev/null || echo "::warning ::Could not checkout commit, using current code"
          fi
          
          modal deploy deploy.py \
            --name "$APP_NAME" \
            -e prod \
            --tag "$VERSION"